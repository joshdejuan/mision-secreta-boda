<style>
:root{
  color-scheme:light;
  --paper:#F3EEE4; --card:rgba(255,253,249,.72); --card-solid:#FBF8F2;
  --ink:#6F3E1E; --brown:#895129; --muted:#9B7960; --line:#E2D6C6;
  --teal:#23C4B3; --teal-deep:#11897D; --teal-soft:#DDF3EF;
  --salmon:#EC8F6E; --salmon-deep:#C4603D; --salmon-soft:#F8E1D6;
  --display:"Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --serif:"Gilda Display", "Cormorant Garamond", Georgia, serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --btn:#895129; --btn-ink:#FFF9F2; --btn-hover:#6F3E1E; --blend:normal;
}
@media screen and (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --paper:#1C1814; --card:rgba(42,35,29,.82); --card-solid:#27211C;
    --ink:#EFE4D6; --brown:#E3B893; --muted:#B39D87; --line:#3B322B;
    --teal:#3FD8C8; --teal-deep:#62E2D5; --teal-soft:#15332F;
    --salmon:#F2A185; --salmon-deep:#F48C6A; --salmon-soft:#3C261E;
    --btn:#E3B893; --btn-ink:#1C1611; --btn-hover:#F0CFAF; --blend:multiply;
  }
}
*{box-sizing:border-box}
html{background:var(--paper);overflow-x:clip}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 var(--body);background:var(--paper) url("assets/papel.jpg") repeat top center/1100px auto;background-blend-mode:var(--blend);padding-inline:16px;padding-block:0 56px;overflow-x:clip}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
a{color:var(--teal-deep)}
button,.btn{font:700 15px/1 var(--body);border:0;border-radius:999px;padding:13px 20px;cursor:pointer;background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;position:relative}
button:hover,.btn:hover{background:var(--btn-hover)}
.ghost{background:transparent!important;color:var(--brown)!important;box-shadow:inset 0 0 0 1.5px var(--line)}
.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--brown)}
.danger{background:transparent!important;color:var(--salmon-deep)!important;box-shadow:inset 0 0 0 1.5px var(--salmon-soft)}
.danger.armed{background:var(--salmon-deep)!important;color:#fff!important;box-shadow:none}
.small{padding:9px 14px;font-size:13.5px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input[type=text],input[type=email],input[type=password],input[type=number],select{font:600 17px var(--body);color:var(--ink);background:var(--card-solid);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;width:100%}
input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.label{font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.status{font-size:14.5px;min-height:22px}
.status.err{color:var(--salmon-deep)}
.status.ok{color:var(--teal-deep)}
[hidden]{display:none!important}

/* ---------- barra de vista previa ---------- */
.demo-bar{max-width:1240px;margin:0 auto;padding-block:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line)}
.demo-bar nav{display:flex;gap:6px;flex-wrap:wrap}
.demo-bar a{font:700 13px var(--body);color:var(--brown);text-decoration:none;padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.demo-bar a[aria-current]{background:var(--btn);color:var(--btn-ink);box-shadow:none}

/* ---------- invitado ---------- */
.guest{position:relative;max-width:520px;margin:0 auto;padding-top:36px;display:flex;flex-direction:column;gap:22px}
.branch{position:absolute;pointer-events:none;user-select:none;z-index:0}
.guest .branch{width:300px;top:-6px;right:-150px;transform:rotate(-58deg);opacity:.95}
@media (min-width:760px){.guest .branch{width:560px;top:120px;right:auto;left:-470px;transform:rotate(-84deg)}}
.guest>*:not(.branch){position:relative;z-index:1}
.hero{display:flex;flex-direction:column;gap:6px;padding-right:70px}
.kicker{font:800 16px var(--body);color:var(--brown);display:flex;align-items:center;gap:8px;margin:0}
.kicker svg{width:17px;height:17px;fill:var(--teal)}
.names{font:400 clamp(56px,16vw,76px)/.95 var(--display);color:var(--teal);letter-spacing:.01em;margin-top:6px}
.names span{display:block}
.date{font:400 clamp(22px,6vw,27px)/1.2 var(--serif);color:var(--salmon);margin:14px 0 0}
.place{font:400 20px var(--serif);color:var(--brown);margin:0}
.intro{font-size:17.5px;margin:0;max-width:40ch}
.sheet{background:var(--card);backdrop-filter:blur(2px);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.form{display:flex;flex-direction:column;gap:12px}
.resume{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--teal-soft);border-radius:18px;padding:14px 18px}
.resume img{grid-row:1/span 2;width:40px;height:40px}
.resume strong{font:400 22px var(--serif)}
.resume small{grid-column:2;color:var(--teal-deep);font-weight:700}
.resume i{grid-row:1/span 2;grid-column:3;font-style:normal;font-size:22px;color:var(--teal-deep)}
.progress{display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track div{height:100%;background:var(--teal);border-radius:99px;transition:width .6s}
.retos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reto{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}
.reto .n{font:400 24px var(--serif);color:var(--salmon)}
.reto .t{font-weight:700;line-height:1.3}
.reto.done .n{color:var(--teal)}
.reto.done .t{color:var(--muted);font-weight:600}
.reto .side{display:flex;align-items:center;gap:8px}
.shoot{display:flex;flex-direction:column;align-items:center;gap:4px}
.shoot label.again{font-size:11.5px}
.reto .side img{width:54px;height:54px;object-fit:cover;border-radius:12px;border:2px solid var(--teal)}
label.btn input,label.again input{position:absolute;inset:0;opacity:0;width:1px;height:1px}
label.again{font:700 12.5px var(--body);color:var(--muted);text-decoration:underline;cursor:pointer;position:relative}
.notice{margin:0;font-size:15px;font-weight:700;color:var(--teal-deep);background:var(--teal-soft);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center}
.notice svg{flex:none;width:22px;height:22px}
.spot img{animation:fadein .9s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.win{background:var(--teal-soft);border-radius:16px;padding:14px 16px;font-weight:700;color:var(--teal-deep)}
.keep{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.keep .row{display:flex;gap:8px}
.keep input{font:600 13px var(--body);padding:9px 12px}

/* ---------- panel de los novios ---------- */
.admin{max-width:1240px;margin:0 auto;padding-top:22px;position:relative}
.admin.screen{max-width:1500px;padding-top:28px}
.a-top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding-bottom:16px}
.a-brand{display:flex;align-items:center;gap:14px}
.a-brand img{width:46px;height:46px}
.a-brand h1{font:800 26px/1.1 var(--body);color:var(--teal-deep)}
.a-brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.a-user{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px;scrollbar-width:none}
.tabs a{font:800 14px var(--body);color:var(--muted);text-decoration:none;padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current]{color:var(--brown);border-color:var(--teal)}
.panel-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.section-title{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.section-title h2{font:800 28px/1.15 var(--body);color:var(--brown)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.login{max-width:440px;margin:40px auto;display:flex;flex-direction:column;gap:14px;position:relative}
.login>*:not(.branch){position:relative;z-index:1}
.login h1{font:800 34px/1.1 var(--body);color:var(--teal-deep)}
.login .branch{width:320px;top:-80px;right:-150px;transform:rotate(-30deg);opacity:.9}

/* directo */
.live-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 34px;margin-bottom:20px}
.live-dot{display:inline-flex;align-items:center;gap:12px;font:800 20px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--salmon-deep)}
.live-dot::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--salmon);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.live-names{font:400 clamp(40px,5vw,64px)/1 var(--display);color:var(--teal);margin-top:4px}
.stats{display:flex;gap:30px;flex-wrap:wrap}
.stat b{display:block;font:800 clamp(34px,4vw,52px)/1 var(--body);color:var(--brown);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted);font-weight:700}
.live-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.live-grid{grid-template-columns:1fr}}
.spot{position:relative;border-radius:22px;overflow:hidden;background:var(--card-solid);border:1px solid var(--line);aspect-ratio:4/3;max-width:100%}
.spot img{width:100%;height:100%;object-fit:cover;display:block}
.spot .cap{position:absolute;inset:auto 0 0 0;padding:60px 22px 18px;background:linear-gradient(transparent,rgba(58,30,12,.78));color:#fff;display:flex;flex-direction:column;gap:2px}
.spot .cap strong{font:400 clamp(24px,2.6vw,36px)/1.15 var(--serif)}
.spot .cap span{font-size:14.5px;opacity:.9;font-weight:600}
.spot .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.spot.flash{animation:flash 1s ease-out}
@keyframes flash{from{box-shadow:0 0 0 8px var(--teal)}to{box-shadow:0 0 0 0 transparent}}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.feed figure{margin:0;position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card-solid)}
.feed img{width:100%;height:100%;object-fit:cover;display:block}
.feed figcaption{position:absolute;inset:auto 0 0 0;font:700 11.5px/1.2 var(--body);color:#fff;padding:18px 8px 7px;background:linear-gradient(transparent,rgba(58,30,12,.75))}
.board h3{font:800 24px var(--body);color:var(--brown);margin-bottom:6px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);transition:background .5s}
.rank li:last-child{border-bottom:0}
.rank .pos{font:800 18px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.rank li:first-child .pos{color:var(--salmon)}
.rank .who{font-weight:800;min-width:0;overflow-wrap:anywhere}
.rank .who small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.rank li.bump{background:var(--teal-soft)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--teal)}
.dots b{font:800 20px var(--body);min-width:24px;text-align:right;color:var(--brown)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--salmon-soft);color:var(--ink)}

/* invitados */
.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:52px minmax(160px,1.4fr) 130px 90px 120px auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.prow.head{font:800 11.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-block:6px 10px}
.prow .num{font:400 20px var(--serif);color:var(--salmon);font-variant-numeric:tabular-nums}
.prow .name-edit{display:flex;gap:6px}
.prow .name-edit input{padding:9px 12px;font-size:15px;border-radius:10px}
.prow .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:860px){
  .prow{grid-template-columns:44px 1fr;row-gap:6px}
  .prow.head{display:none}
  .prow>:nth-child(n+3){grid-column:2}
  .prow .acts{justify-content:flex-start}
}
/* fotos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pcard{background:var(--card-solid);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pcard .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;flex:1}
.pcard .meta strong{font-size:14.5px}
.pcard .acts{display:flex;gap:6px;padding:0 12px 12px}
/* retos */
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:36px 1fr auto auto;gap:10px;align-items:center}
.rrow .n{font:400 20px var(--serif);color:var(--salmon);text-align:right;font-variant-numeric:tabular-nums}
.rrow input{padding:10px 13px;font-size:15.5px;border-radius:11px}
.rrow .use{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
@media (max-width:620px){.rrow{grid-template-columns:30px 1fr auto}.rrow .use{grid-column:2}}
.row-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-inline input[type=number]{width:90px}
/* cartel */
.poster{position:relative;overflow:hidden;max-width:520px;margin:0 auto;background:var(--paper) url("assets/papel.jpg") center/cover;background-blend-mode:var(--blend);border:1px solid var(--line);border-radius:6px;padding:40px 30px 34px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.poster .branch{width:360px;top:130px;left:-150px;transform:rotate(-80deg)}
.poster>*:not(.branch){position:relative;z-index:1}
.poster .names{font-size:62px;margin:4px 0 0}
.poster .date{margin-top:4px;font-size:22px}
.poster p.lead{font-size:17px;margin:8px 0 6px;max-width:30ch}
.qrbox{background:#FFFDF8;padding:12px;border-radius:14px;width:236px;height:236px;max-width:100%;display:grid;place-items:center;position:relative}
.qrbox img:not(.logo),.qrbox canvas{width:212px!important;height:212px!important}
.qrbox .logo{position:absolute;width:46px;height:46px;background:#FFFDF8;border-radius:10px;padding:5px;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
.poster .url{font:800 14px var(--body);color:var(--brown);overflow-wrap:anywhere;margin:0}
/* acceso */
.alist{list-style:none;margin:0 0 16px;padding:0}
.alist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-weight:700;overflow-wrap:anywhere}

@media print{
  body{background:#fff;padding:0}
  .demo-bar,.a-top,.tabs,.section-title,.no-print{display:none!important}
  .poster{border:0;margin-top:10mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const DEMO = !/github\.io$|sarajoshua\.love$/.test(location.hostname);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const app = $("#app");
const PAIR = `${CONFIG.novio1}&${CONFIG.novio2}`;
const HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.6 4.5c2.1 0 3.6 1.1 4.4 2.5.8-1.4 2.3-2.5 4.4-2.5 3.6 0 5.7 3.5 4.2 7.1C19.5 16.4 12 21 12 21z"/></svg>`;

function base(){ return DEMO ? CONFIG.urlBase : location.origin + location.pathname; }
function ago(ts){
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 45) return "ahora mismo";
  if (s < 3600) return "hace " + Math.round(s / 60) + " min";
  if (s < 86400) return "hace " + Math.round(s / 3600) + " h";

}
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar " + src)); document.head.appendChild(s); });
}
const KEY = "mision-sj", PKEY = "mision-sj-panel";
let memMe = null, memPass = null;
function getPass(){ try { return localStorage.getItem(PKEY) || memPass; } catch { return memPass; } }
function setPass(v){ memPass = v; try { v ? localStorage.setItem(PKEY, v) : localStorage.removeItem(PKEY); } catch {} }
function me(){ try { return JSON.parse(localStorage.getItem(KEY) || "null") || memMe; } catch { return memMe; } }
function remember(v){ memMe = v; try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch {} }

async function compress(file, max = 1600){
  let src;
  try { src = await createImageBitmap(file); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("no es una foto")); i.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement("canvas"); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
}
function armed(btn, fn){
  btn.addEventListener("click", async () => {
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed"); btn.dataset.label = btn.textContent; btn.textContent = "Confirmar";
      setTimeout(() => { if (btn.isConnected && btn.classList.contains("armed") && !btn.disabled) { btn.classList.remove("armed"); btn.textContent = btn.dataset.label; } }, 4000);
      return;
    }
    btn.disabled = true; btn.textContent = "Borrando…";
    try { await fn(); } catch (e) { console.error(e); btn.disabled = false; btn.classList.remove("armed"); btn.textContent = "No se pudo borrar"; }
  });
}

   ========================================================= */
async function liveStore(){
  await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js");
  const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  const pub = p => sb.storage.from("fotos").getPublicUrl(p).data.publicUrl;
  const E = r => { if (r.error) throw r.error; return r.data; };
  const withUrls = d => ({ ...d, photos: (d.photos || []).map(p => ({ ...p, url: pub(p.path) })) });
  let cache = null, cacheAt = 0;
  const admin = async (fn, args = {}) => {
    const d = E(await sb.rpc(fn, { p_pass: getPass(), ...args }));
    if (d && d.error === "auth") { setPass(null); const e = new Error("auth"); e.auth = true; throw e; }
    if (d && d.error) throw new Error(d.error);
    cache = null;
    return d;
  };
  const data = async () => {
    if (cache && Date.now() - cacheAt < 1500) return cache;
    const d = E(await sb.rpc("admin_data", { p_pass: getPass() }));
    if (d && d.error) { setPass(null); const e = new Error("auth"); e.auth = true; throw e; }
    cache = withUrls(d); cacheAt = Date.now(); return cache;
  };
  const removeFiles = async paths => { if (paths && paths.length) { try { await sb.storage.from("fotos").remove(paths); } catch (e) { console.warn(e); } } };
  return {
    async register(name){ return E(await sb.rpc("register", { p_name: name })); },
    async mine(token){
      const d = E(await sb.rpc("my_mission", { p_token: token }));
      if (!d) return null;
      d.token = token; d.photos = (d.photos || []).map(p => ({ ...p, url: pub(p.path) }));
      return d;
    },
    async addPhoto(m, mission, blob){
      const path = `${m.id}/${Date.now()}-${uid().slice(0, 6)}.jpg`;
      E(await sb.storage.from("fotos").upload(path, blob, { contentType: "image/jpeg" }));
      E(await sb.rpc("add_photo", { p_token: m.token, p_mission: mission, p_path: path }));
    },
    async status(){ return E(await sb.rpc("admin_status")); },
    async setup(pass){ const d = E(await sb.rpc("admin_setup", { p_pass: pass })); if (d.error) throw new Error(d.error); setPass(pass); },
    async login(pass){ const d = E(await sb.rpc("admin_login", { p_pass: pass })); if (d.ok) { setPass(pass); return true; } return false; },
    async logout(){ setPass(null); },
    async players(){ return (await data()).players; },
    async photos(){ return (await data()).photos; },
    async config(){ return (await data()).config; },
    async screenKey(){ return (await data()).screen_key; },
    async saveConfig(retos, n){ await admin("admin_save_config", { p_retos: retos, p_n: n }); },
    async renamePlayer(id, name){ await admin("admin_rename", { p_id: id, p_name: name }); },
    async deletePhoto(ph){ const d = await admin("admin_delete_photo", { p_id: ph.id }); await removeFiles(d.paths); },
    async deletePlayer(id){ const d = await admin("admin_delete_player", { p_id: id }); await removeFiles(d.paths); },
    async setPassword(nw){ await admin("admin_set_password", { p_new: nw }); setPass(nw); },
    async newScreenKey(){ return (await admin("admin_new_screen_key")).screen_key; },
    async screen(key){ const d = E(await sb.rpc("screen_data", { p_key: key })); return d ? withUrls(d) : null; }
  };
}

function demoStore(){
  const cfg = { retos: [
    "El primer paso hacia el altar","El «sí, quiero» visto desde tu sitio","Alguien secándose una lágrima","El primer beso de casados",
    "La lluvia de arroz o pétalos","Los anillos en primer plano","Un selfie con los novios","Tres generaciones brindando juntas",
    "Alguien bailando descalzo","El corte de la tarta","Un camarero en plena acción","La mesa más ruidosa del banquete",
    "Un abrazo de más de cinco segundos","Algo azul","Los zapatos de uno de los novios","Un niño adueñándose de la pista",
    "Una corbata donde no debería estar","Foto de grupo con diez personas o más","Alguien emocionado durante un discurso","Tu mejor cara de espía",
    "Un brindis con alguien que acabas de conocer","El detalle de decoración que más te guste","Los novios riéndose a carcajadas","Alguien que se sabe toda la canción"
  ], retos_por_persona: 5 };
  const pick = card => { const M = cfg.retos.length, n = Math.min(cfg.retos_por_persona, M), s = ((card - 1) * n) % M; return Array.from({ length: n }, (_, j) => (s + j) % M); };
  const fake = seed => {
    const c = document.createElement("canvas"); c.width = c.height = 480; const g = c.getContext("2d");
    const pal = [["#9ED9CF","#4E8C84"],["#F2C3AE","#B8694A"],["#E8DCC8","#8E6C4E"],["#BFE3DC","#2F8F84"],["#F5D9C9","#C98663"]][seed % 5];
    const gr = g.createLinearGradient(0, 0, 480, 480); gr.addColorStop(0, pal[0]); gr.addColorStop(1, pal[1]); g.fillStyle = gr; g.fillRect(0, 0, 480, 480);
    for (let i = 0; i < 12; i++) { g.fillStyle = `rgba(255,250,240,${.06 + (i % 4) * .05})`; g.beginPath(); g.arc((seed * 71 + i * 97) % 480, (seed * 37 + i * 53) % 480, 16 + (seed * 13 + i * 29) % 58, 0, 7); g.fill(); }
    g.fillStyle = "rgba(255,255,255,.92)"; g.font = "700 20px Nunito, sans-serif"; g.fillText("foto de ejemplo", 22, 452);
    return c.toDataURL("image/jpeg", .8);
  };
  const players = [], photos = [];
  const names = ["Lucía","Marcos","Tía Carmen","Pablo","Irene","Abuelo Paco","Nerea","Diego","Alba","Hugo"];
  const t0 = Date.now() - 70 * 60000; let seed = 1;
  names.forEach((n, i) => players.push({ id: "p" + i, token: "t" + i, card: i + 1, name: n, missions: pick(i + 1), created_at: new Date(t0 + i * 90000).toISOString() }));
  [5, 4, 4, 3, 3, 2, 1, 1, 0, 0].forEach((k, i) => players[i].missions.slice(0, k).forEach(m => photos.push({ id: uid(), player_id: players[i].id, card: players[i].card, mission: m, mission_text: cfg.retos[m], url: fake(seed++), created_at: new Date(t0 + ((seed * 131) % 60) * 60000).toISOString() })));
  photos.sort((a, b) => a.created_at.localeCompare(b.created_at));
  const emit = () => {};
  return {
    demo: true,
    async register(name){ const card = Math.max(0, ...players.map(p => p.card)) + 1; const p = { id: uid(), token: uid(), card, name, missions: pick(card), created_at: new Date().toISOString() }; players.push(p); emit("players", { new: p }); return { token: p.token, card, name }; },
    async mine(token){ const p = players.find(x => x.token === token); if (!p) return null; return { id: p.id, token, card: p.card, name: p.name, retos: p.missions.map(i => ({ i, text: cfg.retos[i] })), photos: photos.filter(x => x.player_id === p.id) }; },
    async addPhoto(m, mission, blob){ const p = players.find(x => x.id === m.id); const ph = { id: uid(), player_id: p.id, card: p.card, mission, mission_text: cfg.retos[mission], url: URL.createObjectURL(blob), created_at: new Date().toISOString() }; photos.push(ph); emit("photos", { new: ph }); },
    async status(){ return { has_password: true }; },
    async setup(p){ setPass(p); }, async login(p){ setPass(p || "vista-previa"); return true; }, async logout(){ setPass(null); },
    async screenKey(){ return "ejemplo"; }, async newScreenKey(){ return "ejemplo"; }, async setPassword(){},
    async screen(){ return { players: players.map(p => ({ ...p })), photos: photos.slice(), config: { retos: cfg.retos.slice(), retos_por_persona: cfg.retos_por_persona } }; },
    async players(){ return players.map(p => ({ ...p })); },
    async photos(){ return photos.slice(); },
    async config(){ return { retos: cfg.retos.slice(), retos_por_persona: cfg.retos_por_persona }; },
    async saveConfig(r, n){ cfg.retos = r.slice(); cfg.retos_por_persona = n; },
    async renamePlayer(id, name){ players.find(p => p.id === id).name = name; },
    async deletePhoto(ph){ const i = photos.findIndex(x => x.id === ph.id); if (i >= 0) photos.splice(i, 1); },
    async deletePlayer(id){ for (let i = photos.length - 1; i >= 0; i--) if (photos[i].player_id === id) photos.splice(i, 1); players.splice(players.findIndex(p => p.id === id), 1); },
    simulate(){
      const cand = []; players.forEach(p => { const done = new Set(photos.filter(x => x.player_id === p.id).map(x => x.mission)); p.missions.forEach(m => { if (!done.has(m)) cand.push([p, m]); }); });
      if (!cand.length) return; const [p, m] = cand[Math.floor(Math.random() * cand.length)];
      const ph = { id: uid(), player_id: p.id, card: p.card, mission: m, mission_text: cfg.retos[m], url: fake(seed++), created_at: new Date().toISOString() };
      photos.push(ph); emit("photos", { new: ph });
    }
  };
}

function score(players, photos){
  const map = {}; players.forEach(p => map[p.id] = { p, set: new Set(), last: 0, count: 0 });
  photos.forEach(ph => { const s = map[ph.player_id]; if (!s) return; s.count++; if (s.p.missions.includes(ph.mission)) s.set.add(ph.mission); s.last = Math.max(s.last, new Date(ph.created_at).getTime()); });
  return map;
}

      <span class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k < s.set.size ? "on" : ""}"></i>`).join("")}<b>${s.set.size}</b></span></li>`).join("")
      : `<li><span></span><span class="muted">Todavía nadie se ha registrado.</span><span></span></li>`;
    const caught = new Set(photos.map(p => p.mission));
    const pend = cfg.retos.map((t, i) => [t, i]).filter(([, i]) => !caught.has(i));
    $("#pend").innerHTML = pend.length ? pend.slice(0, 12).map(([t]) => `<span>${esc(t)}</span>`).join("") + (pend.length > 12 ? `<span>y ${pend.length - 12} más</span>` : "") : `<span>¡Todos cazados!</span>`;
    const rec = photos.slice().reverse(), top = (showId && photos.find(p => p.id === showId)) || rec[0];
    const key = top ? top.id + "|" + ago(top.created_at) : "vacio";
    if (key !== spotKey) { spotKey = key; $("#spot").innerHTML = top ? `<img src="${esc(top.url)}" alt=""><div class="cap"><strong>${esc(top.mission_text || cfg.retos[top.mission] || "")}</strong><span>${esc(byId[top.player_id]?.name || "")} · ${ago(top.created_at)}</span></div>`
      : `<div class="empty">Las fotos aparecerán aquí en cuanto alguien cumpla un reto.</div>`; }
    $("#feed").innerHTML = rec.slice(1, 13).map(ph => `<figure><img src="${esc(ph.url)}" alt="" loading="lazy"><figcaption>${esc(byId[ph.player_id]?.name || "")}</figcaption></figure>`).join("");
  };
  render();
  let alive = true, busy = false, lastNewAt = Date.now(), cycle = [];
  const rotate = () => {
    if (!alive || document.hidden || d.photos.length < 2 || Date.now() - lastNewAt < 25000) return;
    if (!cycle.length) cycle = d.photos.map(p => p.id).filter(id => id !== showId).sort(() => Math.random() - .5);
    showId = cycle.shift(); render();
  };
  const rot = setInterval(rotate, 9000);
  const tick = async () => {
    if (!alive || busy || document.hidden) return; busy = true;
    try {
      if (store.demo) store.simulate();
      const nd = await load(); if (!alive) return;
      const newest = nd.photos.length ? nd.photos[nd.photos.length - 1] : null;
      const isNew = newest && newest.id !== lastId;
      if (isNew) { lastId = newest.id; bump = newest.player_id; showId = null; lastNewAt = Date.now(); cycle = []; }
      d = nd; render(); if (isNew) flash();
    } catch (e) { if (e.auth) { alive = false; loginNote = "Vuelve a entrar."; viewLogin(); } }
    finally { busy = false; }
  };
  const poll = setInterval(tick, store.demo ? 7000 : 6000);
  $("#fs").addEventListener("click", async () => { try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch {} });
  let lock = null; try { lock = await navigator.wakeLock?.request("screen"); } catch {}
  cleanup = () => { alive = false; clearInterval(poll); clearInterval(rot); try { lock?.release(); } catch {} };
}

async function viewScreen(key){

async function tabPhotos(el){
  const q = new URLSearchParams(location.hash.split("?")[1] || "");
  const [players, photos] = await Promise.all([store.players(), store.photos()]);
  const byId = Object.fromEntries(players.map(p => [p.id, p]));
  let filter = q.get("p") || "";
  el.innerHTML = `<div class="section-title"><h2>Todas las fotos</h2><div class="tools">
      <select id="flt" aria-label="Filtrar por invitado" style="width:auto;padding:10px 14px;font-size:14.5px"><option value="">Todos los invitados</option>${players.map(p => `<option value="${esc(p.id)}" ${p.id === filter ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      <button id="zip" ${store.demo ? 'disabled title="Disponible en tu web"' : ""}>Descargar todas (ZIP)</button></div></div>
    <div class="status" id="st"></div><div class="pgrid" id="grid"></div>`;
  const draw = () => {
    const list = photos.filter(p => !filter || p.player_id === filter).slice().reverse();
    $("#grid").innerHTML = list.length ? list.map(p => `<article class="pcard" data-id="${esc(p.id)}"><img src="${esc(p.url)}" alt="" loading="lazy">
      <div class="meta"><strong>${esc(byId[p.player_id]?.name || "Invitado borrado")}</strong><span>${esc(p.mission_text || "")}</span><span class="muted">${ago(p.created_at)}</span></div>
      <div class="acts"><a class="ghost btn small" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir</a><button class="danger small del">Borrar</button></div></article>`).join("")
      : `<p class="muted">No hay fotos todavía.</p>`;
    $("#grid").querySelectorAll(".pcard").forEach(card => { const ph = photos.find(p => p.id === card.dataset.id); armed(card.querySelector(".del"), async () => { await store.deletePhoto(ph); photos.splice(photos.indexOf(ph), 1); card.remove(); }); });
  };
  draw();
  $("#flt").addEventListener("change", e => { filter = e.target.value; draw(); });
  $("#zip").addEventListener("click", async () => {
    const st = $("#st");
    try {
      st.className = "status"; st.textContent = "Preparando el ZIP…";
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
      const zip = new JSZip(), safe = s => String(s || "").replace(/[^\p{L}\p{N} ]/gu, "").trim().slice(0, 40);
      for (let i = 0; i < photos.length; i++) {
        const p = photos[i]; st.textContent = `Descargando foto ${i + 1} de ${photos.length}…`;
        zip.file(`${pad(i + 1)} - ${safe(byId[p.player_id]?.name)} - ${safe(p.mission_text)}.jpg`, await (await fetch(p.url)).blob());
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(await zip.generateAsync({ type: "blob" })); a.download = "fotos-sara-joshua.zip"; a.click();
      st.className = "status ok"; st.textContent = `Listo: ${photos.length} fotos.`;
    } catch (e) { console.error(e); st.className = "status err"; st.textContent = "No se pudo crear el ZIP. Inténtalo de nuevo con buena conexión."; }
  });
}

async function tabRetos(el){
  const [cfg, players] = await Promise.all([store.config(), store.players()]);
  const draft = cfg.retos.slice();
  const use = i => players.filter(p => p.missions.includes(i)).length;
  const locked = players.length > 0;
  el.innerHTML = `<div class="section-title"><h2>Retos</h2><span class="muted">${draft.length} retos · cada invitado recibe unos distintos al registrarse</span></div>
    <div class="panel-box" style="display:flex;flex-direction:column;gap:18px">
      <div class="row-inline"><label class="label" for="nper">Retos por invitado</label><input type="number" id="nper" min="1" max="10" value="${cfg.retos_por_persona}"><span class="muted" style="font-size:13.5px">Se aplica a quien se registre a partir de ahora.</span></div>
      <div class="rlist" id="rl"></div>
      <div class="row-inline"><input type="text" id="newr" maxlength="90" placeholder="Nuevo reto, por ejemplo: Alguien bailando con la abuela" style="flex:1;min-width:220px"><button class="ghost" id="add">Añadir</button></div>
      ${locked ? `<p class="muted" style="margin:0;font-size:14px">Como ya hay invitados registrados, los retos existentes no se pueden quitar: solo corregir su texto. Los nuevos sí. Para empezar de cero, borra antes a los invitados.</p>` : ""}
      <div class="row-inline"><button id="save">Guardar cambios</button><span class="status" id="st"></span></div></div>`;
  const draw = () => {
    $("#rl").innerHTML = draft.map((t, i) => `<div class="rrow"><span class="n">${i + 1}</span><input type="text" value="${esc(t)}" data-i="${i}" maxlength="90" aria-label="Reto ${i + 1}">
      <span class="use">${i < cfg.retos.length ? `en ${use(i)} ${use(i) === 1 ? "misión" : "misiones"}` : "nuevo"}</span>
      ${locked && i < cfg.retos.length ? "<span></span>" : `<button class="danger small rm" data-i="${i}" aria-label="Quitar reto ${i + 1}">Quitar</button>`}</div>`).join("");
    $("#rl").querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => { draft[+inp.dataset.i] = inp.value; }));
    $("#rl").querySelectorAll(".rm").forEach(b => b.addEventListener("click", () => { draft.splice(+b.dataset.i, 1); draw(); }));
  };
  draw();
  const addIt = () => { const v = $("#newr").value.trim(); if (!v) return; draft.push(v); $("#newr").value = ""; draw(); };
  $("#add").addEventListener("click", addIt);
  $("#newr").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addIt(); } });
  $("#save").addEventListener("click", async () => {
    const st = $("#st"), n = Math.max(1, Math.min(10, +$("#nper").value || 5));
    if (locked && draft.slice(0, cfg.retos.length).some(t => !t.trim())) { st.className = "status err"; st.textContent = "Hay retos vacíos. Escribe algo en ellos antes de guardar."; return; }
    const clean = draft.map(t => t.trim()).filter(Boolean);
    if (clean.length < n) { st.className = "status err"; st.textContent = `Necesitas al menos ${n} retos.`; return; }
    $("#save").disabled = true; st.className = "status"; st.textContent = "Guardando…";
    try { await store.saveConfig(clean, n); st.className = "status ok"; st.textContent = "Guardado."; setTimeout(() => tabRetos(el), 800); }
    catch (e) { console.error(e); st.className = "status err"; st.textContent = "No se pudo guardar. Inténtalo otra vez."; $("#save").disabled = false; }
  });
}

      <label class="label" for="np">Nueva contraseña</label><input type="password" id="np" autocomplete="new-password" minlength="6" required>
      <label class="label" for="np2">Repítela</label><input type="password" id="np2" autocomplete="new-password" minlength="6" required>
      <div class="row-inline"><button type="submit">Guardar contraseña</button><span class="status" id="pst"></span></div>
    </form></div>`;
  $("#cp").addEventListener("click", async () => { const i = $("#sl"); try { await navigator.clipboard.writeText(i.value); $("#cp").textContent = "Copiado"; } catch { i.select(); $("#cp").textContent = "Selecciónalo y copia"; } });
  armed($("#nk"), async () => { await store.newScreenKey(); await tabAccess(el); });
  $("#pf").addEventListener("submit", async e => {

    catch (err) { st.className = "status err"; st.textContent = "No se pudo cambiar. Inténtalo otra vez."; }
  });
}

async function route(){
  cleanup(); cleanup = () => {};
  const tok = location.hash.match(/^#m-([0-9a-z-]{8,})$/i);
  if (tok) {
    const d = await store.mine(tok[1]).catch(() => null);
    if (d) remember({ token: tok[1], card: d.card, name: d.name });
    history.replaceState(null, "", location.pathname + "#mision");
  }
  window.scrollTo(0, 0);
  try {
    const path = location.hash.replace(/^#/, "").split("?")[0];
    if (path === "mision") await viewMission();
    else if (path === "admin" || path.startsWith("admin/")) await viewAdmin(path.split("/")[1]);
    else if (path === "pantalla" && store.demo) await viewScreen("ejemplo");
    else if (path.startsWith("pantalla-")) await viewScreen(path.slice(9));
    else viewHome();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<main class="guest"><div class="sheet"><h1 class="names" style="font-size:40px">Algo ha fallado</h1><p>No hay conexión. Recarga la página en unos segundos.</p></div></main>`;
  }
}

(async () => {
  try { store = DEMO ? demoStore() : await liveStore(); }
  catch (e) { app.innerHTML = `<main class="guest"><div class="sheet"><h1 class="names" style="font-size:40px">Sin conexión</h1><p>Comprueba la cobertura y recarga la página.</p></div></main>`; return; }
  window.addEventListener("hashchange", route);
  route();
})();
