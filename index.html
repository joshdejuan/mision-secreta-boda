<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A8344F">
</head>
<body>
<title>Misión Secreta Boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --bg:#F3F1F5; --surface:#FFFFFF; --paper:#FBFAFC; --ink:#261F2E; --muted:#766D80;
  --line:#E1DCE6; --accent:#A8344F; --accent-soft:#F6E4E8; --accent-ink:#FFFFFF;
  --sage:#4F7361; --sage-soft:#E3EDE7; --gold:#9A7428;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16121B; --surface:#211B28; --paper:#1C1722; --ink:#F1EDF4; --muted:#A99FB3;
    --line:#342C3D; --accent:#E27690; --accent-soft:#3A2230; --accent-ink:#1A0F15;
    --sage:#8DB7A1; --sage-soft:#1F2E27; --gold:#D8B46A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16121B; --surface:#211B28; --paper:#1C1722; --ink:#F1EDF4; --muted:#A99FB3;
  --line:#342C3D; --accent:#E27690; --accent-soft:#3A2230; --accent-ink:#1A0F15;
  --sage:#8DB7A1; --sage-soft:#1F2E27; --gold:#D8B46A;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wide{max-width:1320px;margin:0 auto}
a{color:var(--accent)}
button,.btn{font:600 15px/1 var(--body);border:0;border-radius:999px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.ghost,button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
button:focus-visible,.btn:focus-within,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=number]{font:500 18px var(--body);padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.demo-bar{max-width:1320px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:12px}
.demo-bar nav{display:flex;gap:6px;flex-wrap:wrap}
.demo-bar nav a{font:600 13px var(--body);color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.demo-bar nav a[aria-current="page"]{background:var(--ink);color:var(--bg);box-shadow:none}

/* ---------- home ---------- */
.home-hero{display:flex;flex-direction:column;gap:12px;padding-block:24px 8px}
.home-hero h1{font-size:clamp(40px,9vw,64px)}
.seal{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:400 26px var(--display);box-shadow:0 0 0 6px var(--accent-soft)}
.routes{display:grid;gap:12px}
.route{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.route strong{font:400 22px var(--display)}
.route span{grid-column:1;color:var(--muted);font-size:14px}
.route i{grid-row:1/span 2;grid-column:2;font-style:normal;font-size:22px;color:var(--accent)}

/* ---------- guest dossier ---------- */
.dossier{background:var(--paper);border:1px solid var(--line);border-radius:6px 22px 6px 6px;padding:22px 18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.dossier::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 26px)}
.d-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stamp{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:2px solid var(--accent);padding:4px 8px;border-radius:4px;transform:rotate(-4deg)}
.dossier h1{font-size:clamp(32px,8vw,44px)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--sage);border-radius:99px;transition:width .5s}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.m{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.m-n{font:700 13px var(--mono);color:var(--muted)}
.m-t{font-weight:600;line-height:1.3}
.m.done .m-n{color:var(--sage)}
.m.done .m-t{color:var(--muted)}
.m-side{display:flex;align-items:center;gap:8px}
.m-side img{width:52px;height:52px;object-fit:cover;border-radius:10px;border:2px solid var(--sage)}
.btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn.small{padding:10px 14px;font-size:14px}
.again{font:600 12px var(--body);color:var(--muted);background:none;padding:6px 4px;border-radius:6px}
.again input{position:absolute;width:1px;height:1px;opacity:0}
label.again{cursor:pointer;text-decoration:underline;position:relative}
.status{font-size:14px;min-height:21px}
.status.err{color:var(--accent)}
.win{background:var(--sage-soft);color:var(--ink);border-radius:14px;padding:14px 16px;font-weight:600}
.join{display:flex;flex-direction:column;gap:12px}

/* ---------- panel ---------- */
.p-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.p-title h1{font-size:clamp(34px,5vw,60px)}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--accent)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font:400 clamp(30px,4vw,46px)/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.p-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.p-grid{grid-template-columns:1fr}}
.spot{position:relative;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);aspect-ratio:4/3;max-width:100%}
.spot img{width:100%;height:100%;object-fit:cover;display:block}
.spot .cap{position:absolute;inset:auto 0 0 0;padding:44px 20px 18px;background:linear-gradient(transparent,rgba(12,8,16,.82));color:#fff;display:flex;flex-direction:column;gap:4px}
.spot .cap strong{font:400 clamp(22px,2.6vw,34px)/1.15 var(--display)}
.spot .cap span{font-size:14px;opacity:.85}
.spot.flash{animation:flash .9s ease-out}
@keyframes flash{from{box-shadow:0 0 0 8px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
.spot .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.feed figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface)}
.feed img{width:100%;height:100%;object-fit:cover;display:block}
.feed figcaption{position:absolute;inset:auto 0 0 0;font:600 11px/1.2 var(--body);color:#fff;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(12,8,16,.8))}
.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.board h2{font-size:28px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);transition:background .4s}
.rank li:last-child{border-bottom:0}
.rank .pos{font:700 15px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rank li:nth-child(1) .pos{color:var(--gold)}
.rank .who{font-weight:600;min-width:0;overflow-wrap:anywhere}
.rank .who small{display:block;font:400 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sage)}
.pts{font:400 22px var(--display);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.rank li.bump{background:var(--sage-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cards / admin ---------- */
.adm-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.adm-head h1{font-size:clamp(32px,5vw,48px)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;grid-template-columns:1fr 96px;gap:10px 14px;break-inside:avoid;position:relative}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 20px)}
.card .c-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:4px}
.card h3{font-size:24px;grid-column:1/-1}
.card ol{margin:0;padding-left:20px;font-size:14px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
.qr{width:96px;height:96px;background:#fff;padding:5px;border-radius:4px;align-self:end}
.qr img,.qr canvas{width:86px!important;height:86px!important;display:block}
.card .foot{grid-column:1/-1;font-size:12px;color:var(--muted)}
.pin{max-width:360px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
@media print{
  body{background:#fff;padding:0}
  .demo-bar,.adm-head,.no-print{display:none!important}
  .cards{grid-template-columns:1fr 1fr;gap:6mm}
  .card{background:#fff;color:#000;border:1px solid #bbb}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"><p class="muted" style="text-align:center;padding:40px 0">Cargando…</p></div>

<script>
/* =====================================================================
   CONFIGURACIÓN — edita esto antes de publicar
   ===================================================================== */
const CONFIG = {
  novios: "Sara & Joshua",
  fecha: "",                       // p. ej. "12 de junio de 2027"
  supabaseUrl: "",                 // Project URL de Supabase (vacío = modo demo)
  supabaseKey: "",                 // anon public key de Supabase
  pinAdmin: "1234",                // PIN para ver e imprimir las tarjetas
  tarjetas: 83,                    // una por invitado
  retosPorTarjeta: 5,
  urlBase: "",                     // vacío = la dirección donde publiques la web
  retos: [
    "El primer paso hacia el altar",
    "El «sí, quiero» visto desde tu sitio",
    "Alguien secándose una lágrima",
    "El primer beso de casados",
    "La lluvia de arroz o pétalos",
    "Los anillos en primer plano",
    "Un selfie con los novios",
    "Tres generaciones brindando juntas",
    "Alguien bailando descalzo",
    "El corte de la tarta",
    "Un camarero en plena acción",
    "La mesa más ruidosa del banquete",
    "Un abrazo de más de cinco segundos",
    "Algo azul",
    "Los zapatos de uno de los novios",
    "Un niño adueñándose de la pista",
    "Una corbata donde no debería estar",
    "Foto de grupo con diez personas o más",
    "Alguien emocionado durante un discurso",
    "Tu mejor cara de espía",
    "Un brindis con alguien que acabas de conocer",
    "El detalle de decoración que más te guste",
    "Los novios riéndose a carcajadas",
    "Alguien que se sabe toda la canción"
  ]
};
/* ===================================================================== */

const LIVE = !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const app = $("#app");

function missionsFor(card){
  const M = CONFIG.retos.length, n = Math.min(CONFIG.retosPorTarjeta, M);
  const start = ((card - 1) * n) % M, out = [];
  for (let j = 0; j < n; j++) out.push((start + j) % M);
  return out;
}
function ago(ts){
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 45) return "ahora mismo";
  if (s < 3600) return "hace " + Math.round(s / 60) + " min";
  return "hace " + Math.round(s / 3600) + " h";
}
function baseUrl(){
  if (CONFIG.urlBase) return CONFIG.urlBase.replace(/#.*$/, "");
  return location.origin + location.pathname;
}
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar " + src)); document.head.appendChild(s); });
}

/* ---------- compresión de fotos ---------- */
async function compress(file, max = 1600){
  let src;
  try { src = await createImageBitmap(file); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Ese archivo no parece una foto.")); i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
}

/* ---------- almacén: Supabase ---------- */
async function liveStore(){
  await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
  const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
  const withUrl = r => ({ ...r, url: sb.storage.from("fotos").getPublicUrl(r.path).data.publicUrl });
  const store = {
    async players(){ const { data, error } = await sb.from("players").select("*").order("created_at"); if (error) throw error; return data; },
    async photos(){ const { data, error } = await sb.from("photos").select("*").order("created_at"); if (error) throw error; return data.map(withUrl); },
    async player(card){ const { data, error } = await sb.from("players").select("*").eq("card", card).maybeSingle(); if (error) throw error; return data; },
    async join(card, name){
      const { data, error } = await sb.from("players").insert({ card, name }).select().single();
      if (error) { if (error.code === "23505") return store.player(card); throw error; }
      return data;
    },
    async upload(player, mission, blob){
      const path = `tarjeta-${player.card}/${Date.now()}-${uid().slice(0, 6)}.jpg`;
      const up = await sb.storage.from("fotos").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      const { data, error } = await sb.from("photos").insert({ player_id: player.id, card: player.card, mission, mission_text: CONFIG.retos[mission], path }).select().single();
      if (error) throw error;
      return withUrl(data);
    },
    on(fn){
      subs.push(fn);
      if (subs.length > 1) return;
      sb.channel("boda")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "photos" }, p => subs.forEach(f => f("photo", withUrl(p.new))))
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "players" }, p => subs.forEach(f => f("player", p.new)))
        .subscribe();
    }
  };
  const subs = [];
  return store;
}

/* ---------- almacén: demo en memoria ---------- */
function fakePhoto(seed){
  const c = document.createElement("canvas"); c.width = 480; c.height = 480;
  const g = c.getContext("2d"), h = (seed * 47) % 360;
  const gr = g.createLinearGradient(0, 0, 480, 480);
  gr.addColorStop(0, `hsl(${h} 42% 62%)`); gr.addColorStop(1, `hsl(${(h + 60) % 360} 38% 32%)`);
  g.fillStyle = gr; g.fillRect(0, 0, 480, 480);
  for (let i = 0; i < 14; i++) {
    const r = ((seed * 13 + i * 29) % 60) + 12;
    g.fillStyle = `hsla(${(h + i * 20) % 360} 70% 90% / ${0.08 + (i % 4) * 0.06})`;
    g.beginPath(); g.arc((seed * 71 + i * 97) % 480, (seed * 31 + i * 53) % 480, r, 0, 7); g.fill();
  }
  g.fillStyle = "rgba(255,255,255,.9)"; g.font = "600 22px Figtree, sans-serif"; g.fillText("foto de ejemplo", 24, 452);
  return c.toDataURL("image/jpeg", 0.8);
}
function demoStore(){
  const subs = [], players = [], photos = [];
  const names = ["Lucía", "Marcos", "Tía Carmen", "Pablo", "Irene", "Abuelo Paco", "Sara", "Diego", "Nerea"];
  const cards = [1, 2, 3, 4, 5, 6, 7, 8, 9];
  const t0 = Date.now() - 50 * 60000;
  names.forEach((n, i) => players.push({ id: "p" + i, card: cards[i], name: n, created_at: new Date(t0 + i * 60000).toISOString() }));
  const plan = [5, 4, 4, 3, 2, 2, 1, 1, 0];
  let seed = 1;
  players.forEach((p, i) => missionsFor(p.card).slice(0, plan[i]).forEach((m, j) => {
    photos.push({ id: uid(), player_id: p.id, card: p.card, mission: m, mission_text: CONFIG.retos[m], url: fakePhoto(seed++), created_at: new Date(t0 + (seed * 97000) % (48 * 60000)).toISOString() });
  }));
  photos.sort((a, b) => a.created_at.localeCompare(b.created_at));
  const emit = (t, x) => subs.forEach(f => f(t, x));
  const store = {
    demo: true,
    async players(){ return players.slice(); },
    async photos(){ return photos.slice(); },
    async player(card){ return players.find(p => p.card === card) || null; },
    async join(card, name){ let p = players.find(x => x.card === card); if (!p) { p = { id: uid(), card, name, created_at: new Date().toISOString() }; players.push(p); emit("player", p); } return p; },
    async upload(player, mission, blob){
      const ph = { id: uid(), player_id: player.id, card: player.card, mission, mission_text: CONFIG.retos[mission], url: URL.createObjectURL(blob), created_at: new Date().toISOString() };
      photos.push(ph); emit("photo", ph); return ph;
    },
    on(fn){ subs.push(fn); },
    simulate(){
      const cand = [];
      players.forEach(p => { const done = new Set(photos.filter(x => x.card === p.card).map(x => x.mission)); missionsFor(p.card).forEach(m => { if (!done.has(m)) cand.push([p, m]); }); });
      if (!cand.length) return;
      const [p, m] = cand[Math.floor(Math.random() * cand.length)];
      const ph = { id: uid(), player_id: p.id, card: p.card, mission: m, mission_text: CONFIG.retos[m], url: fakePhoto(seed++), created_at: new Date().toISOString() };
      photos.push(ph); emit("photo", ph);
    }
  };
  return store;
}

/* ---------- vistas ---------- */
let store, cleanup = () => {};

function demoBar(current){
  if (!store.demo) return "";
  const l = (h, t) => `<a href="#${h}" ${current === h ? 'aria-current="page"' : ""}>${t}</a>`;
  return `<div class="demo-bar"><span><b>Vista previa</b> con invitados de ejemplo</span><nav>${l("inicio","Inicio")}${l("c-12","Tarjeta de invitado")}${l("panel","Panel en directo")}${l("tarjetas","Tarjetas")}</nav></div>`;
}

function viewHome(){
  if (store.demo) {
    app.innerHTML = demoBar("inicio") + `<div class="wrap">
      <div class="home-hero"><div class="seal">✕</div><p class="mono muted">Misión secreta · ${esc(CONFIG.novios)}</p>
      <h1>Cada invitado, un fotógrafo encubierto</h1>
      <p class="muted">Cada invitado recibe una tarjeta con un QR y cinco momentos que fotografiar. Sube las fotos desde el móvil, sin instalar nada, y todo aparece al instante en el panel.</p></div>
      <div class="routes">
        <a class="route" href="#c-12"><strong>Tarjeta de invitado</strong><span>Lo que ve alguien al escanear su QR</span><i>→</i></a>
        <a class="route" href="#panel"><strong>Panel en directo</strong><span>Para la pantalla o proyector: fotos y clasificación</span><i>→</i></a>
        <a class="route" href="#tarjetas"><strong>Tarjetas para imprimir</strong><span>Una por invitado, cada una con retos distintos</span><i>→</i></a>
      </div></div>`;
    return;
  }
  app.innerHTML = `<div class="wrap"><div class="home-hero"><div class="seal">✕</div>
    <p class="mono muted">${esc(CONFIG.fecha)}</p><h1>${esc(CONFIG.novios)}</h1>
    <p class="muted">Escanea el QR de tu tarjeta para ver tu misión secreta.</p></div></div>`;
}

async function viewGuest(card){
  if (!(card >= 1 && card <= CONFIG.tarjetas)) { app.innerHTML = demoBar("") + `<div class="wrap"><h1>Esta tarjeta no existe</h1><p class="muted">Vuelve a escanear el QR de tu tarjeta.</p></div>`; return; }
  const mine = missionsFor(card);
  let player = await store.player(card);
  const code = `Expediente Nº ${pad(card)}`;

  if (!player) {
    app.innerHTML = demoBar("c-12") + `<div class="wrap"><div class="dossier">
      <div class="d-head"><span class="mono muted">${code}</span><span class="stamp">Confidencial</span></div>
      <h1>Tienes una misión</h1>
      <p>Durante la boda de ${esc(CONFIG.novios)} tendrás que fotografiar ${mine.length} momentos sin que nadie sospeche. Cada foto suma un punto en la clasificación en directo.</p>
      <form class="join" id="join"><label for="nombre" class="mono muted">Tu nombre de agente</label>
      <input id="nombre" type="text" maxlength="30" autocomplete="given-name" placeholder="Tu nombre" required>
      <button type="submit">Aceptar la misión</button><div class="status" id="st"></div></form></div></div>`;
    $("#join").addEventListener("submit", async e => {
      e.preventDefault();
      const name = $("#nombre").value.trim(); if (!name) return;
      e.submitter && (e.submitter.disabled = true);
      try { await store.join(card, name); viewGuest(card); }
      catch (err) { $("#st").className = "status err"; $("#st").textContent = "No se pudo guardar tu nombre. Revisa la conexión y vuelve a intentarlo."; e.submitter && (e.submitter.disabled = false); }
    });
    return;
  }

  const photos = (await store.photos()).filter(p => p.card === card);
  const byM = {}; photos.forEach(p => { byM[p.mission] = p; });
  const done = mine.filter(m => byM[m]).length;
  app.innerHTML = demoBar("c-12") + `<div class="wrap"><div class="dossier">
    <div class="d-head"><span class="mono muted">${code}</span><span class="stamp">Confidencial</span></div>
    <h1>Agente ${esc(player.name)}</h1>
    <div><div class="bar"><div style="width:${done / mine.length * 100}%"></div></div>
    <p class="muted" style="margin:6px 0 0;font-size:14px">${done} de ${mine.length} momentos capturados</p></div>
    ${done === mine.length ? `<div class="win">Misión cumplida. Estás en la clasificación del panel: aún puedes añadir más fotos.</div>` : ""}
    <ol class="missions">${mine.map((m, i) => {
      const ph = byM[m];
      return `<li class="m ${ph ? "done" : ""}"><span class="m-n">${pad(i + 1)}</span><span class="m-t">${esc(CONFIG.retos[m])}</span>
      <span class="m-side">${ph
        ? `<img src="${esc(ph.url)}" alt="Tu foto de este reto"><label class="again">Otra<input type="file" accept="image/*" data-m="${m}"></label>`
        : `<label class="btn small">Capturar<input type="file" accept="image/*" data-m="${m}"></label>`}</span></li>`;
    }).join("")}</ol>
    <div class="status" id="st" aria-live="polite"></div>
    <p class="muted" style="font-size:13px;margin:0">Consejo: haz la foto con la cámara normal y súbela aquí luego, así no te pierdes el momento.</p>
  </div></div>`;

  app.querySelectorAll('input[type=file]').forEach(inp => inp.addEventListener("change", async () => {
    const f = inp.files[0]; if (!f) return;
    const st = $("#st"); st.className = "status"; st.textContent = "Subiendo foto…";
    app.querySelectorAll('input[type=file]').forEach(x => x.disabled = true);
    try { const blob = await compress(f); await store.upload(player, +inp.dataset.m, blob); await viewGuest(card); $("#st").textContent = "Foto guardada."; }
    catch (err) { st.className = "status err"; st.textContent = "No se pudo subir la foto. Comprueba la cobertura y prueba otra vez."; app.querySelectorAll('input[type=file]').forEach(x => x.disabled = false); }
  }));
}

async function viewPanel(){
  let players = await store.players(), photos = await store.photos(), lastBump = null;
  app.innerHTML = demoBar("panel") + `<div class="wide">
    <header class="p-head"><div class="p-title"><p class="mono live" style="margin:0 0 6px">En directo</p><h1>${esc(CONFIG.novios)}</h1></div>
    <div class="stats" id="stats"></div>
    <div class="tools no-print"><button class="ghost" id="fs">Pantalla completa</button></div></header>
    <div class="p-grid"><section><div class="spot" id="spot"></div><div class="feed" id="feed"></div></section>
    <aside class="board"><h2>Clasificación</h2><ol class="rank" id="rank"></ol>
    <div><p class="mono muted" style="margin:0 0 8px">Aún sin cazar</p><div class="chips" id="pend"></div></div></aside></div></div>`;
  const pmap = () => Object.fromEntries(players.map(p => [p.card, p]));

  function render(flash){
    const pm = pmap(), n = Math.min(CONFIG.retosPorTarjeta, CONFIG.retos.length);
    const score = {};
    players.forEach(p => score[p.card] = { p, set: new Set(), last: 0 });
    photos.forEach(ph => { const s = score[ph.card]; if (!s) return; if (missionsFor(ph.card).includes(ph.mission)) s.set.add(ph.mission); s.last = Math.max(s.last, new Date(ph.created_at).getTime()); });
    const list = Object.values(score).sort((a, b) => b.set.size - a.set.size || a.last - b.last).slice(0, 10);
    const totalDone = Object.values(score).reduce((a, s) => a + s.set.size, 0);
    $("#stats").innerHTML = `<div class="stat"><b>${players.length}</b><span>agentes</span></div><div class="stat"><b>${photos.length}</b><span>fotos</span></div><div class="stat"><b>${totalDone}</b><span>retos cumplidos</span></div>`;
    $("#rank").innerHTML = list.length ? list.map((s, i) => `<li class="${lastBump === s.p.card ? "bump" : ""}"><span class="pos">${pad(i + 1)}</span>
      <span class="who">${esc(s.p.name)}<small>Nº ${pad(s.p.card)}</small></span>
      <span class="dots" aria-label="${s.set.size} de ${n}">${Array.from({ length: n }, (_, k) => `<i class="${k < s.set.size ? "on" : ""}"></i>`).join("")}<span class="pts">${s.set.size}</span></span></li>`).join("")
      : `<li><span></span><span class="muted">Aún no hay agentes. Aparecerán aquí al escanear su tarjeta.</span><span></span></li>`;
    const caught = new Set(photos.map(p => p.mission));
    const pending = CONFIG.retos.map((t, i) => [t, i]).filter(([, i]) => !caught.has(i));
    $("#pend").innerHTML = pending.length ? pending.slice(0, 12).map(([t]) => `<span>${esc(t)}</span>`).join("") + (pending.length > 12 ? `<span>+${pending.length - 12} más</span>` : "") : `<span>¡Todos cazados!</span>`;
    const recent = photos.slice().reverse();
    const top = recent[0];
    $("#spot").innerHTML = top ? `<img src="${esc(top.url)}" alt=""><div class="cap"><strong>${esc(top.mission_text || CONFIG.retos[top.mission])}</strong><span>${esc(pm[top.card]?.name || "Agente")} · ${ago(top.created_at)}</span></div>`
      : `<div class="empty">Las fotos aparecerán aquí en cuanto alguien complete un reto.</div>`;
    if (flash) { const s = $("#spot"); s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash"); }
    $("#feed").innerHTML = recent.slice(1, 13).map(ph => `<figure><img src="${esc(ph.url)}" alt="" loading="lazy"><figcaption>${esc(pm[ph.card]?.name || "")}</figcaption></figure>`).join("");
  }
  render();

  let alive = true;
  store.on((t, x) => {
    if (!alive) return;
    if (t === "player" && !players.find(p => p.card === x.card)) players.push(x);
    if (t === "photo" && !photos.find(p => p.id === x.id)) { photos.push(x); lastBump = x.card; }
    render(t === "photo");
  });
  const poll = setInterval(async () => { try { if (!store.demo) { players = await store.players(); photos = await store.photos(); } render(); } catch {} }, 30000);
  const sim = store.demo ? setInterval(() => store.simulate(), 6000) : null;
  $("#fs").addEventListener("click", async () => { try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch {} });
  let lock = null; try { lock = await navigator.wakeLock?.request("screen"); } catch {}
  cleanup = () => { alive = false; clearInterval(poll); sim && clearInterval(sim); try { lock?.release(); } catch {} };
}

let adminOk = false;
async function viewCards(){
  if (!store.demo && !adminOk) {
    app.innerHTML = `<form class="pin" id="pin"><h1>Tarjetas</h1><label for="pinv" class="muted">PIN de los novios</label>
      <input id="pinv" type="password" inputmode="numeric" autocomplete="off"><button type="submit">Entrar</button><div class="status err" id="st"></div></form>`;
    $("#pin").addEventListener("submit", e => { e.preventDefault(); if ($("#pinv").value === CONFIG.pinAdmin) { adminOk = true; viewCards(); } else $("#st").textContent = "PIN incorrecto."; });
    return;
  }
  const hasQR = await loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js").then(() => true, () => false);
  const cards = Array.from({ length: CONFIG.tarjetas }, (_, i) => i + 1);
  app.innerHTML = demoBar("tarjetas") + `<div class="wide"><div class="adm-head"><div><p class="mono muted" style="margin:0 0 6px">${CONFIG.tarjetas} tarjetas · ${CONFIG.retos.length} retos</p><h1>Tarjetas para imprimir</h1></div>
    <div class="tools">${store.demo ? `<span class="muted" style="font-size:14px;max-width:320px">En tu web aparecerán aquí los botones para imprimir las tarjetas y descargar todas las fotos en un ZIP.</span>`
      : `<button id="print">Imprimir tarjetas</button><button class="ghost" id="zip">Descargar todas las fotos</button>`}</div></div>
    <div class="status" id="st"></div>
    <div class="cards">${cards.map(c => `<article class="card"><div class="c-top"><span class="mono muted">Nº ${pad(c)}</span><span class="stamp">Confidencial</span></div>
      <h3>Tu misión secreta</h3><ol>${missionsFor(c).map(m => `<li>${esc(CONFIG.retos[m])}</li>`).join("")}</ol>
      <div class="qr" data-c="${c}"></div><p class="foot">Escanea, fotografía y sube. ${esc(CONFIG.novios)}${CONFIG.fecha ? " · " + esc(CONFIG.fecha) : ""}</p></article>`).join("")}</div></div>`;
  if (hasQR && window.QRCode) app.querySelectorAll(".qr").forEach(el => new QRCode(el, { text: baseUrl() + "#c-" + el.dataset.c, width: 172, height: 172, correctLevel: QRCode.CorrectLevel.M }));
  if (!store.demo) {
    $("#print").addEventListener("click", () => window.print());
    $("#zip").addEventListener("click", async () => {
      const st = $("#st");
      try {
        st.textContent = "Preparando el ZIP…";
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
        const [pl, ph] = [await store.players(), await store.photos()];
        const names = Object.fromEntries(pl.map(p => [p.card, p.name]));
        const zip = new JSZip();
        for (let i = 0; i < ph.length; i++) {
          const p = ph[i]; st.textContent = `Descargando foto ${i + 1} de ${ph.length}…`;
          const b = await (await fetch(p.url)).blob();
          const safe = s => String(s || "").replace(/[^\p{L}\p{N} ]/gu, "").trim().slice(0, 40);
          zip.file(`${pad(i + 1)} - ${safe(names[p.card])} - ${safe(p.mission_text)}.jpg`, b);
        }
        const out = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(out); a.download = "fotos-boda.zip"; a.click();
        st.textContent = `Listo: ${ph.length} fotos.`;
      } catch (e) { st.textContent = "No se pudo crear el ZIP. Inténtalo de nuevo con buena conexión."; }
    });
  }
}

async function route(){
  cleanup(); cleanup = () => {};
  const h = location.hash.replace(/^#/, "");
  const m = h.match(/^c-(\d+)$/);
  window.scrollTo(0, 0);
  try {
    if (m) await viewGuest(+m[1]);
    else if (h === "panel") await viewPanel();
    else if (h === "tarjetas") await viewCards();
    else viewHome();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="wrap"><h1>Algo ha fallado</h1><p class="muted">No hay conexión con la base de datos. Recarga la página en unos segundos.</p></div>`;
  }
}

(async () => {
  try { store = LIVE ? await liveStore() : demoStore(); }
  catch (e) { app.innerHTML = `<div class="wrap"><h1>Sin conexión</h1><p class="muted">No se pudo conectar. Comprueba la cobertura y recarga la página.</p></div>`; return; }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
